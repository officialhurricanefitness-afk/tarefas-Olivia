<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mundo da Olívia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,#f5e9dd 0%,#e8e2f2 38%,#dcebf0 72%,#f2e6e9 100%);
    color:#2e2b28;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- fundo abstrato colorido, com vida ---------- */
  .bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}

  .orb{
    position:absolute;border-radius:50%;
    filter:blur(60px);
    mix-blend-mode:multiply;
    will-change:transform;
  }
  /* rosa pêssego */
  .o1{
    width:480px;height:480px;top:-160px;left:-140px;
    background:radial-gradient(circle at 40% 40%,#ffb8a0,#ff8fa8 60%,transparent 75%);
    opacity:.55;
    animation:float1 18s ease-in-out infinite;
  }
  /* lavanda */
  .o2{
    width:520px;height:520px;bottom:-200px;right:-180px;
    background:radial-gradient(circle at 60% 40%,#b9a8f0,#8f7bdc 55%,transparent 75%);
    opacity:.5;
    animation:float2 22s ease-in-out infinite;
  }
  /* azul turquesa */
  .o3{
    width:360px;height:360px;top:38%;right:-140px;
    background:radial-gradient(circle at 50% 50%,#8ee0da,#5cc4c9 55%,transparent 75%);
    opacity:.45;
    animation:float3 20s ease-in-out infinite;
  }
  /* amarelo suave */
  .o4{
    width:300px;height:300px;bottom:10%;left:-120px;
    background:radial-gradient(circle at 50% 50%,#ffe9a8,#f6cf7a 55%,transparent 75%);
    opacity:.4;
    animation:float4 24s ease-in-out infinite;
  }
  /* rosa aveludado */
  .o5{
    width:260px;height:260px;top:22%;left:30%;
    background:radial-gradient(circle at 50% 50%,#f8c4d4,#eea3c2 55%,transparent 75%);
    opacity:.35;
    animation:float2 26s ease-in-out infinite reverse;
  }

  /* véu suave que mantém o topo legível */
  .veil{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 65%);
  }

  @keyframes float1{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(40px,30px) scale(1.08)}
  }
  @keyframes float2{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-50px,-30px) scale(1.06)}
  }
  @keyframes float3{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-30px,40px) scale(1.1)}
  }
  @keyframes float4{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(35px,-25px) scale(1.05)}
  }

  @media (prefers-reduced-motion:reduce){
    .orb{animation:none}
  }

  /* ---------- estrutura ---------- */
  .shell{
    position:relative;z-index:1;
    width:min(100vw,400px);
    height:min(100dvh,860px);
    display:flex;flex-direction:column;gap:14px;
    padding:34px 20px 22px;
  }

  .card{
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    backdrop-filter:blur(20px) saturate(160%);
    box-shadow:
      0 12px 32px rgba(80,60,90,.09),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  /* ---------- cabeçalho ---------- */
  .date{
    margin:0 0 10px;
    font-size:11px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;
    color:#7d6f7a;
  }
  h1{
    margin:0 0 4px;
    font-family:"Fraunces",Georgia,serif;
    font-weight:500;font-size:38px;line-height:1.04;
    letter-spacing:-.015em;
    background:linear-gradient(120deg,#3b2f3d,#5c4b62 45%,#3a5560);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:#3b2f3d;
  }

  /* ---------- progresso ---------- */
  .progress{padding:14px 18px 16px;border-radius:20px;display:flex;flex-direction:column;gap:10px}
  .progress-row{display:flex;justify-content:space-between;font-size:13px;color:#6f6069}
  .track{height:6px;border-radius:99px;background:rgba(60,50,70,.1);overflow:hidden}
  .fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#ff9fb2 0%,#b59cf5 55%,#6fd0d6 100%);
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- adicionar ---------- */
  .add{display:flex;align-items:center;gap:8px;padding:6px;border-radius:18px}
  .add input{
    flex:1;min-width:0;height:44px;padding:0 12px;
    border:0;background:transparent;outline:none;
    font-size:16px;color:#2e2b28;
  }
  .add input::placeholder{color:#a293a5}
  .add button{
    height:44px;padding:0 18px;border:0;border-radius:14px;
    background:linear-gradient(135deg,#4b3a58,#2f4a55);
    color:#fdf8ff;
    font-size:14px;font-weight:600;cursor:pointer;
    transition:filter .2s,transform .15s,box-shadow .2s;
    box-shadow:0 6px 16px rgba(80,60,90,.25);
  }
  .add button:hover{filter:brightness(1.12)}
  .add button:active{transform:scale(.97)}

  /* ---------- separadores ---------- */
  .tabs{display:flex;gap:8px}
  .tab{
    height:36px;padding:0 15px;border-radius:99px;
    font-size:13px;font-weight:600;cursor:pointer;
    color:#5f5560;
    background:rgba(255,255,255,.4);
    border:1px solid rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    transition:background .2s,color .2s,border-color .2s,box-shadow .2s;
  }
  .tab:hover{background:rgba(255,255,255,.7)}
  .tab.active{
    background:linear-gradient(135deg,#4b3a58,#2f4a55);
    color:#fdf8ff;border-color:transparent;
    box-shadow:0 6px 16px rgba(80,60,90,.22);
  }

  /* ---------- lista ---------- */
  .list{
    list-style:none;margin:0;padding:0;
    flex:1;min-height:0;overflow-y:auto;
    display:flex;flex-direction:column;gap:8px;
    scrollbar-width:none;
  }
  .list::-webkit-scrollbar{width:0}

  .item{
    display:flex;align-items:center;gap:4px;
    padding:4px 4px 4px 6px;border-radius:16px;
    background:rgba(255,255,255,.5);
    border:1px solid rgba(255,255,255,.8);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    box-shadow:0 6px 18px rgba(80,60,90,.07);
    animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .check{
    width:42px;height:42px;flex:none;border:0;background:transparent;
    border-radius:50%;cursor:pointer;display:grid;place-items:center;
  }
  .box{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid rgba(80,60,90,.4);
    display:grid;place-items:center;
    transition:background .2s,border-color .2s,box-shadow .2s;
  }
  .box svg{opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
  .item.done .box{
    background:linear-gradient(135deg,#b59cf5,#6fd0d6);
    border-color:transparent;
    box-shadow:0 3px 10px rgba(140,110,190,.35);
  }
  .item.done .box svg{opacity:1;transform:scale(1)}

  .text{
    flex:1;min-width:0;
    font-size:15.5px;line-height:1.3;
    overflow-wrap:anywhere;color:#2e2b28;
    transition:color .2s;
  }
  .item.done .text{
    color:#a99fb0;
    text-decoration:line-through;
    text-decoration-color:rgba(140,120,160,.6);
  }

  .del{
    width:38px;height:38px;flex:none;border:0;background:transparent;
    border-radius:50%;cursor:pointer;display:grid;place-items:center;
    color:rgba(80,60,90,.6);opacity:.6;
    transition:opacity .2s,background .2s;
  }
  .del:hover{opacity:1;background:rgba(80,60,90,.08)}

  .empty{
    padding:38px 14px;text-align:center;
    font-size:14px;line-height:1.5;color:#8c8290;
  }

  /* ---------- limpar ---------- */
  .clear{
    height:46px;border-radius:16px;
    font-size:13.5px;font-weight:600;cursor:pointer;
    color:#5f5560;
    background:rgba(255,255,255,.45);
    border:1px solid rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    transition:background .2s,color .2s;
  }
  .clear:hover{background:rgba(255,255,255,.75);color:#3b2f3d}
  .clear:disabled{opacity:.4;cursor:default}
  .clear:disabled:hover{background:rgba(255,255,255,.45);color:#5f5560}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb o1"></span>
  <span class="orb o2"></span>
  <span class="orb o3"></span>
  <span class="orb o4"></span>
  <span class="orb o5"></span>
  <span class="veil"></span>
</div>

<main class="shell">
  <header>
    <p class="date" id="date"></p>
    <h1>Mundo da<br>Olívia</h1>
  </header>

  <section class="card progress" aria-label="Progresso">
    <div class="progress-row">
      <span id="counter"></span>
      <span id="percent"></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </section>

  <form class="card add" id="addForm">
    <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Nova tarefa</label>
    <input id="input" type="text" placeholder="Nova tarefa…" autocomplete="off" maxlength="180">
    <button type="submit">Adicionar</button>
  </form>

  <nav class="tabs" id="tabs" aria-label="Filtro de tarefas">
    <button type="button" class="tab" data-filter="all">Todas</button>
    <button type="button" class="tab" data-filter="open">Por fazer</button>
    <button type="button" class="tab" data-filter="done">Feitas</button>
  </nav>

  <ul class="list" id="list"></ul>

  <button type="button" class="clear" id="clear">Limpar concluídas</button>
</main>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'mundo-da-olivia-v1';

  var state = {
    filter: 'all',
    next: 4,
    todos: [
      { id: 1, text: 'Marcar consulta', done: false },
      { id: 2, text: 'Responder aos emails do dia', done: false },
      { id: 3, text: 'Toca no círculo para concluir', done: true }
    ]
  };

  /* --- recuperar estado guardado --- */
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      if (saved && Array.isArray(saved.todos)) {
        state.todos = saved.todos;
        state.next = typeof saved.next === 'number'
          ? saved.next
          : saved.todos.reduce(function (m, t) { return Math.max(m, t.id || 0); }, 0) + 1;
      }
    }
  } catch (e) { /* sem persistência disponível */ }

  var listEl    = document.getElementById('list');
  var fillEl    = document.getElementById('fill');
  var counterEl = document.getElementById('counter');
  var percentEl = document.getElementById('percent');
  var dateEl    = document.getElementById('date');
  var inputEl   = document.getElementById('input');
  var clearBtn  = document.getElementById('clear');
  var formEl    = document.getElementById('addForm');
  var tabsEl    = document.getElementById('tabs');

  var CHECK_SVG = '<svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true">' +
    '<path d="M2.5 7.4l3 3 6-6.4" fill="none" stroke="#fdf8ff" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var DEL_SVG = '<svg viewBox="0 0 18 18" width="15" height="15" aria-hidden="true">' +
    '<path d="M4.6 4.6l8.8 8.8M13.4 4.6l-8.8 8.8" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round"/></svg>';

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ todos: state.todos, next: state.next }));
    } catch (e) { /* ignora */ }
  }

  function todayLabel() {
    var s = new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function buildItem(t) {
    var li = document.createElement('li');
    li.className = 'item' + (t.done ? ' done' : '');
    li.dataset.id = String(t.id);

    var check = document.createElement('button');
    check.type = 'button';
    check.className = 'check';
    check.dataset.action = 'toggle';
    check.setAttribute('aria-label', t.done ? 'Marcar como por fazer' : 'Marcar como feita');
    check.innerHTML = '<span class="box">' + CHECK_SVG + '</span>';

    var span = document.createElement('span');
    span.className = 'text';
    span.textContent = t.text;

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.dataset.action = 'remove';
    del.setAttribute('aria-label', 'Apagar tarefa');
    del.innerHTML = DEL_SVG;

    li.appendChild(check);
    li.appendChild(span);
    li.appendChild(del);
    return li;
  }

  function render() {
    var total = state.todos.length;
    var done = state.todos.filter(function (t) { return t.done; }).length;
    var open = total - done;
    var pct = total ? Math.round((done / total) * 100) : 0;

    dateEl.textContent = todayLabel();
    counterEl.textContent = open === 1 ? '1 por fazer' : open + ' por fazer';
    percentEl.textContent = pct + '% concluído';
    fillEl.style.width = pct + '%';

    var shown = state.todos.filter(function (t) {
      if (state.filter === 'open') return !t.done;
      if (state.filter === 'done') return t.done;
      return true;
    });

    listEl.textContent = '';

    if (!shown.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = total === 0
        ? 'O mundo está vazio. Escreve a primeira tarefa acima.'
        : 'Nada por aqui. Muda o filtro ou adiciona uma tarefa.';
      listEl.appendChild(li);
    } else {
      shown.forEach(function (t) { listEl.appendChild(buildItem(t)); });
    }

    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (b) {
      b.classList.toggle('active', b.dataset.filter === state.filter);
    });

    clearBtn.disabled = done === 0;
  }

  /* --- adicionar --- */
  formEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = inputEl.value.trim();
    if (!text) return;
    state.todos.unshift({ id: state.next, text: text, done: false });
    state.next += 1;
    inputEl.value = '';
    if (state.filter === 'done') state.filter = 'all';
    save();
    render();
    inputEl.focus();
  });

  /* --- toggle / apagar --- */
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-action]');
    if (!btn) return;
    var id = Number(btn.closest('.item').dataset.id);

    if (btn.dataset.action === 'toggle') {
      state.todos = state.todos.map(function (t) {
        return t.id === id ? { id: t.id, text: t.text, done: !t.done } : t;
      });
    } else if (btn.dataset.action === 'remove') {
      state.todos = state.todos.filter(function (t) { return t.id !== id; });
    }

    save();
    render();
  });

  /* --- filtros --- */
  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    state.filter = btn.dataset.filter;
    render();
  });

  /* --- limpar concluídas --- */
  clearBtn.addEventListener('click', function () {
    state.todos = state.todos.filter(function (t) { return !t.done; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
